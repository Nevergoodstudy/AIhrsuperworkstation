<main class="wrap">
<header class="masthead"><div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 7h24M16 7v21M8 13h16M8 13v10M24 13v10" stroke="currentColor" stroke-width="1.7"/><path d="m3 25 5-3 5 3m6 0 5-3 5 3" stroke="currentColor" stroke-width="1.4"/></svg><div><strong>TalentDesk</strong><span>招聘工作台</span></div></div><div class="edition"><span>一部关于工作证据的短片</span><span>2026 · 原创制作</span></div></header>
<section class="film" aria-label="简历之后，动态短片播放器">
<div class="screen" id="screen" tabindex="0" role="group" aria-label="影片画面。按空格播放或暂停，左右方向键跳转">

<div class="start-cue" id="startCue"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 2 10 6-10 6z"/></svg><span>点击画面 · 开始播放</span></div>

</div>
<div class="controls"><div class="seekline"><label for="seek" class="sr-only">影片时间</label><input id="seek" type="range" min="0" max="96" step="0.05" value="0" aria-valuetext="0分0秒，共1分36秒"><span class="clock"><b id="now">00:00</b> / 01:36</span></div>
<div class="tools"><div class="transport"><button class="tool play" id="play" type="button" aria-label="播放短片，空格键"><svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4 12 8-12 8z"/></svg><span id="playLabel">播放</span></button><button class="tool" id="restart" type="button" aria-label="从头重播" title="从头重播（R）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9a9 9 0 1 1 0 6M3 3v6h6"/></svg></button><div class="scene-readout"><span id="sceneNumber">01</span><b id="sceneName">简历与判断</b></div></div>
<div class="options"><button class="tool" id="sound" type="button" aria-pressed="true" aria-label="关闭原创配乐" title="原创配乐（M）"><svg id="soundIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="m11 4-6 5H2v6h3l6 5zM15 8c3 2 3 6 0 8M18 5c5 4 5 10 0 14"/></svg><span id="soundLabel">配乐开</span></button><button class="tool" id="captions" type="button" aria-pressed="true" aria-label="关闭字幕" title="字幕（C）"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M10 10a2 2 0 1 0 0 4M18 10a2 2 0 1 0 0 4"/></svg><span>字幕</span></button><button class="tool" id="fullscreen" type="button" aria-label="进入全屏" title="全屏（F），退出按 Esc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>全屏</span></button></div></div></div>
</section>
<div class="film-meta"><div><h1>简历之后</h1><p>经历，是认识一个人的起点。<br>从一页简历，走向一份可以共同复核的工作证据。</p></div><div class="specs"><strong>96 秒 / 8 幕 / 80 BPM</strong><br>原创图形 · 程序配乐 · 离线播放</div></div>
<nav class="chapters" id="chapters" aria-label="跳转章节"></nav>
<p class="mobile-hint">横屏或全屏观看，图形与字幕更清晰。</p>
