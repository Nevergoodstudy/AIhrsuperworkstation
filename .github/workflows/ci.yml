name: Verify business workflow
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Validate production image and Compose configuration
        env:
          SITE_ADDRESS: hr.example.test
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker build -t talentdesk:ci .
      - name: Run isolated container persistence and recovery acceptance
        run: node scripts/container-smoke.mjs talentdesk:ci > container-smoke-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-smoke-report
          path: container-smoke-report.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workflow-diagnostics
          path: test-results/
          retention-days: 7
